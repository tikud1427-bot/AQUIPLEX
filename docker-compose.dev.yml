# AQUA — local development database
# Blueprint E3/PR-1
#
# Nothing in the engine reads through this yet. It exists so that when E3/PR-2
# adds the migration runner, the database it migrates is reproducible rather
# than whatever each machine happens to have installed.
#
#   docker compose -f docker-compose.dev.yml up -d
#   export DATABASE_URL=postgresql://aqua:aqua@localhost:5432/aqua
#   cd aqua && node -e "import('./src/core/db/pool.js').then(async m=>console.log(await m.dbHealth()))"
#
# The image is pgvector/pgvector, not plain postgres: the blueprint puts the
# claim embeddings in the same database as the claims (Part 3), and installing
# the extension later on a database that was never built for it is a migration
# nobody enjoys.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aqua-dev-db
    # Without this a host or Docker Desktop crash leaves the database down
    # until someone notices (2026-10-05 → 10-12: five days of ECONNREFUSED).
    restart: unless-stopped
    environment:
      POSTGRES_USER: aqua
      POSTGRES_PASSWORD: aqua        # local only — production uses DATABASE_URL
      POSTGRES_DB: aqua
    ports:
      - "5432:5432"
    volumes:
      - aqua-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqua -d aqua"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aqua-dev-db:
